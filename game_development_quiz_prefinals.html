<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Development Quiz</title>
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            canvas: '#FAFAFA',
            surface: '#FFFFFF',
            hairline: '#E5E7EB',
            ink: '#111827',
            muted: '#6B7280',
            correct: '#059669',
            incorrect: '#DC2626',
          },
        },
      },
    };
  </script>
  <style>
    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .slide-animate {
      animation: fadeSlide 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-[#FAFAFA] text-[#111827] font-sans antialiased selection:bg-[#111827] selection:text-white min-h-screen flex flex-col justify-between">

  <!-- Minimal Top Progress Line & Counter -->
  <header class="w-full">
    <div class="w-full h-[2px] bg-[#E5E7EB]">
      <div id="progressLine" class="h-full bg-[#111827] transition-all duration-300 ease-out" style="width: 0%;"></div>
    </div>
    <div class="max-w-3xl mx-auto px-6 pt-6 h-12 flex items-center justify-between">
      <span id="topProgressLabel" class="text-xs font-medium tracking-wider uppercase text-[#6B7280]"></span>
      <span id="topTypeLabel" class="text-xs font-medium text-[#6B7280]"></span>
    </div>
  </header>

  <!-- Centered Minimalist Stage -->
  <main class="flex-1 flex items-center justify-center px-6 py-8">
    <div id="slideRoot" class="w-full max-w-3xl">
      <!-- Slide content injected dynamically -->
    </div>
  </main>

  <!-- Minimalist Bottom Navigation Bar -->
  <footer class="w-full border-t border-[#E5E7EB] bg-[#FAFAFA]/90 backdrop-blur-sm">
    <div class="max-w-3xl mx-auto px-6 py-5 flex items-center justify-between gap-4">
      <button
        id="prevBtn"
        type="button"
        class="px-5 py-2.5 rounded-lg text-sm font-medium border border-[#E5E7EB] bg-[#FFFFFF] text-[#111827] hover:bg-gray-50 disabled:opacity-35 disabled:pointer-events-none transition"
      >
        Previous
      </button>

      <button
        id="nextBtn"
        type="button"
        class="px-6 py-2.5 rounded-lg text-sm font-medium bg-[#111827] text-white hover:bg-gray-800 disabled:opacity-35 disabled:pointer-events-none transition"
      >
        Next
      </button>
    </div>
  </footer>

  <script>
    /**
     * 20-Item Combined Quiz Data (Handout 05 + Handout 06)
     * Questions 1–10: Multiple Choice
     * Questions 11–20: True or False
     */
    const QUIZ_DATA = [
      // --- PART 1: MULTIPLE CHOICE (1–10) ---
      {
        id: 1,
        type: 'Multiple Choice',
        question: 'In a racing game where a player loses simply by failing to finish ahead of competing racers rather than running out of health or resources, which type of loss condition is being used?',
        options: [
          { text: 'Implicit loss condition', correct: true },
          { text: 'Explicit loss condition', correct: false },
          { text: 'Zero-sum condition', correct: false },
          { text: 'Imperfect information condition', correct: false },
        ],
        explanation: 'Implicit loss conditions are common in competitive games (such as racing games) against other players or NPCs, whereas explicit loss conditions occur when a character dies or runs out of vital resources.',
      },
      {
        id: 2,
        type: 'Multiple Choice',
        question: 'When players interact directly with the creators of a game through official discussion forums or chat rooms on the game\'s website, which mode of interactivity is taking place?',
        options: [
          { text: 'Player-to-developer interactivity', correct: true },
          { text: 'Player-to-game interactivity', correct: false },
          { text: 'Player-to-player interactivity', correct: false },
          { text: 'Intrinsic interactivity', correct: false },
        ],
        explanation: 'Player-to-developer interactivity occurs when players communicate with the game\'s developers via forums, chat rooms, and direct feedback channels.',
      },
      {
        id: 3,
        type: 'Multiple Choice',
        question: 'In a battle royale game where every player must eliminate all other players to be the sole survivor, what game theory concept describes the conflict created when all players compete against each other?',
        options: [
          { text: 'Prisoner\'s Dilemma', correct: true },
          { text: 'Non-zero sum cooperation', correct: false },
          { text: 'Perfect information', correct: false },
          { text: 'Spatial awareness', correct: false },
        ],
        explanation: 'The Prisoner\'s Dilemma illustrates what happens when all players compete against each other in a battle royale scenario where everyone must eliminate opponents to survive.',
      },
      {
        id: 4,
        type: 'Multiple Choice',
        question: 'In a Pokémon battle, knowing from outside the game world that a Water-type Pokémon is strong against a Fire-type Pokémon is an example of which type of knowledge?',
        options: [
          { text: 'Extrinsic knowledge', correct: true },
          { text: 'Intrinsic knowledge', correct: false },
          { text: 'Perfect information', correct: false },
          { text: 'Implicit challenge', correct: false },
        ],
        explanation: 'Extrinsic knowledge is information gained outside the game world and applied during play, whereas intrinsic knowledge is learned from within the game world itself.',
      },
      {
        id: 5,
        type: 'Multiple Choice',
        question: 'Which game goal involves arranging items in a specific order using spatial and pattern-matching strategies, as seen in puzzle games like Tetris and Bejeweled?',
        options: [
          { text: 'Organization', correct: true },
          { text: 'Capture', correct: false },
          { text: 'Outwit', correct: false },
          { text: 'Taboo', correct: false },
        ],
        explanation: 'Organization is the goal of arranging items in a particular order using spatial and pattern-matching strategies, commonly found in puzzle games like Tetris and Bejeweled.',
      },
      {
        id: 6,
        type: 'Multiple Choice',
        question: 'A designer notices players are sprinting past enemies in an open area to reach the exit early, bypassing the intended combat challenge. Which level-design element should be adjusted to keep players in the area until the objective is met?',
        options: [
          { text: 'Flow', correct: true },
          { text: 'Duration', correct: false },
          { text: 'Availability', correct: false },
          { text: 'Radiosity', correct: false },
        ],
        explanation: 'Level flow governs how designers guide player movement and use barriers to keep players in an area until required objectives are completed.',
      },
      {
        id: 7,
        type: 'Multiple Choice',
        question: 'In a long survival level, a designer adds smaller intermediate goals—finding supplies, restoring power, and reaching the extraction point—so players feel steady progress. What are these smaller achievements called?',
        options: [
          { text: 'Milestones', correct: true },
          { text: 'Cut-scenes', correct: false },
          { text: 'Status screens', correct: false },
          { text: 'Reusable objects', correct: false },
        ],
        explanation: 'Milestones are smaller achievements or checkpoints within a long level that make progress visible and give players a sense of accomplishment.',
      },
      {
        id: 8,
        type: 'Multiple Choice',
        question: 'During an intense action sequence, a player triggers an ability that slows down enemy projectiles while allowing the camera viewpoint to continue moving at normal speed. What is this altered-time technique called?',
        options: [
          { text: 'Bullet time', correct: true },
          { text: 'Authentic time', correct: false },
          { text: 'Limited time', correct: false },
          { text: 'Player-adjusted time', correct: false },
        ],
        explanation: 'Bullet time is an altered-time effect where in-game action slows down while the camera viewpoint can still move at normal speed.',
      },
      {
        id: 9,
        type: 'Multiple Choice',
        question: 'Which camera perspective views the game world directly from above, like a bird looking down at a maze?',
        options: [
          { text: 'Aerial (top-down) perspective', correct: true },
          { text: 'Side-scrolling perspective', correct: false },
          { text: 'Isometric perspective', correct: false },
          { text: 'First-person perspective', correct: false },
        ],
        explanation: 'In an aerial or top-down perspective, the game is viewed from directly above, allowing the player to see corridors and obstacles around the character from a high overhead angle.',
      },
      {
        id: 10,
        type: 'Multiple Choice',
        question: 'In game space design, what do we call the image or pattern applied to a surface to give it visual detail?',
        options: [
          { text: 'Texture', correct: true },
          { text: 'Radiosity', correct: false },
          { text: 'Scale', correct: false },
          { text: 'Game loop', correct: false },
        ],
        explanation: 'A texture is a 2D image or pattern applied to a surface in the game environment to give it visual detail.',
      },

      // --- PART 2: TRUE OR FALSE (11–20) ---
      {
        id: 11,
        type: 'True or False',
        question: 'Even in single-player mode, non-player characters (NPCs) with human-like traits are still generated by an artificial intelligence (AI) system under player-to-game interactivity.',
        options: [
          { text: 'True', correct: true },
          { text: 'False', correct: false },
        ],
        explanation: 'In single-player mode, the player interacts only with the game and platform, and NPCs—no matter how lifelike—are generated by an AI system.',
      },
      {
        id: 12,
        type: 'True or False',
        question: 'In a zero-sum game like chess, both players can simultaneously achieve their primary goal of winning the match.',
        options: [
          { text: 'True', correct: false },
          { text: 'False', correct: true },
        ],
        explanation: 'Zero-sum games involve completely opposing interests where there can be only one winner, making it impossible for both players to win.',
      },
      {
        id: 13,
        type: 'True or False',
        question: 'Games with imperfect information provide players with the complete state of play at all times, eliminating any need to guess or infer missing details.',
        options: [
          { text: 'True', correct: false },
          { text: 'False', correct: true },
        ],
        explanation: 'Imperfect information provides only a fraction of the total information, requiring players to use inference to guess missing details.',
      },
      {
        id: 14,
        type: 'True or False',
        question: 'Micromanagement refers to a high level of detail in resource management where players control specific settings and actions for their resources or characters.',
        options: [
          { text: 'True', correct: true },
          { text: 'False', correct: false },
        ],
        explanation: 'Resource management with a high level of detail is called micromanagement, as seen in strategy games like Clash of Clans.',
      },
      {
        id: 15,
        type: 'True or False',
        question: 'To create a balanced game system, players should face trivial decisions frequently and occasionally become permanently stuck with no way to progress.',
        options: [
          { text: 'True', correct: false },
          { text: 'False', correct: true },
        ],
        explanation: 'A balanced game requires a lack of trivial decisions and a lack of stagnation so players never get permanently stuck.',
      },
      {
        id: 16,
        type: 'True or False',
        question: 'A cut-scene is a short non-interactive sequence used to show story events or explain a situation.',
        options: [
          { text: 'True', correct: true },
          { text: 'False', correct: false },
        ],
        explanation: 'A cut-scene is a short, non-interactive sequence often used at the start or during a level to communicate story events, situations, or objectives.',
      },
      {
        id: 17,
        type: 'True or False',
        question: 'Level progression refers to how long a single level takes to complete, whereas level duration refers to how difficulty increases across the game.',
        options: [
          { text: 'True', correct: false },
          { text: 'False', correct: true },
        ],
        explanation: 'It is the reverse: duration is how long a level takes, while progression is how pacing and challenge develop over time.',
      },
      {
        id: 18,
        type: 'True or False',
        question: 'Adding a visual day-and-night cycle automatically means time is a major gameplay mechanic that changes player abilities and outcomes.',
        options: [
          { text: 'True', correct: false },
          { text: 'False', correct: true },
        ],
        explanation: 'A day-and-night setting may simply create visual atmosphere (limited time) without changing the player\'s available actions.',
      },
      {
        id: 19,
        type: 'True or False',
        question: 'Top-down (aerial) perspective and isometric perspective use the exact same camera angle directly above the character.',
        options: [
          { text: 'True', correct: false },
          { text: 'False', correct: true },
        ],
        explanation: 'Top-down views the scene from directly above, whereas isometric views the landscape at an angle of roughly 30 to 45 degrees.',
      },
      {
        id: 20,
        type: 'True or False',
        question: 'Increasing visual realism and graphical detail in a game can reduce rendering speed and computer efficiency.',
        options: [
          { text: 'True', correct: true },
          { text: 'False', correct: false },
        ],
        explanation: 'Adding excessive visual detail has a performance cost and can slow down how efficiently the computer renders and runs the game.',
      },
    ];

    // State
    const state = {
      slideIndex: 0, // 0 = Intro, 1..20 = Questions, 21 = Results
      questions: [],
      answers: [], // null or selected option index
    };

    // DOM References
    const slideRoot = document.getElementById('slideRoot');
    const progressLine = document.getElementById('progressLine');
    const topProgressLabel = document.getElementById('topProgressLabel');
    const topTypeLabel = document.getElementById('topTypeLabel');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function shuffle(list) {
      const arr = list.map((item) => ({ ...item }));
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function initQuiz() {
      state.questions = QUIZ_DATA.map((q) => ({
        ...q,
        options: q.type === 'Multiple Choice' ? shuffle(q.options) : q.options.map((o) => ({ ...o })),
      }));
      state.answers = new Array(state.questions.length).fill(null);
      state.slideIndex = 0;
      render();
    }

    function selectAnswer(qIdx, optIdx) {
      if (state.answers[qIdx] !== null) return;
      state.answers[qIdx] = optIdx;
      render();
    }

    function goToSlide(index) {
      const maxIndex = state.questions.length + 1;
      if (index < 0 || index > maxIndex) return;
      state.slideIndex = index;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderIntro() {
      topProgressLabel.textContent = '';
      topTypeLabel.textContent = '';
      progressLine.style.width = '0%';

      slideRoot.innerHTML = `
        <div class="slide-animate text-center py-16 sm:py-24">
          <h1 class="text-4xl sm:text-5xl md:text-6xl font-bold tracking-tight text-[#111827]">
            Game Development Quiz
          </h1>
        </div>
      `;
    }

    function renderQuestion(qIdx) {
      const q = state.questions[qIdx];
      const chosenIdx = state.answers[qIdx];
      const isAnswered = chosenIdx !== null;
      const letters = ['A', 'B', 'C', 'D'];

      topProgressLabel.textContent = `${q.id} / ${state.questions.length}`;
      topTypeLabel.textContent = q.type;
      progressLine.style.width = `${(q.id / state.questions.length) * 100}%`;

      const optionsMarkup = q.options
        .map((opt, idx) => {
          const marker = q.type === 'Multiple Choice' ? letters[idx] : idx === 0 ? 'T' : 'F';

          let cardClass =
            'border-[#E5E7EB] bg-[#FFFFFF] text-[#111827] hover:border-[#111827]';
          let markerClass =
            'border-[#E5E7EB] text-[#6B7280] bg-[#FAFAFA]';
          let badgeText = '';

          if (isAnswered) {
            if (opt.correct) {
              cardClass =
                'border-[#059669] bg-emerald-50/60 text-[#111827]';
              markerClass =
                'border-[#059669] bg-[#059669] text-white';
              badgeText = '<span class="ml-auto text-xs font-semibold text-[#059669]">Correct</span>';
            } else if (idx === chosenIdx && !opt.correct) {
              cardClass =
                'border-[#DC2626] bg-rose-50/60 text-[#111827]';
              markerClass =
                'border-[#DC2626] bg-[#DC2626] text-white';
              badgeText = '<span class="ml-auto text-xs font-semibold text-[#DC2626]">Incorrect</span>';
            } else {
              cardClass =
                'border-[#E5E7EB] bg-[#FFFFFF] text-[#6B7280] opacity-55';
            }
          }

          return `
            <button
              type="button"
              data-opt="${idx}"
              ${isAnswered ? 'disabled' : ''}
              class="choice-btn w-full text-left px-5 py-4 rounded-xl border transition-all duration-150 flex items-center gap-4 focus:outline-none ${cardClass}"
            >
              <span class="w-7 h-7 rounded-md border text-xs font-semibold flex items-center justify-center shrink-0 transition-colors ${markerClass}">
                ${marker}
              </span>
              <span class="text-base sm:text-lg font-medium leading-snug">
                ${escapeHTML(opt.text)}
              </span>
              ${badgeText}
            </button>
          `;
        })
        .join('');

      const explanationMarkup = isAnswered
        ? `
          <div class="mt-6 pt-5 border-t border-[#E5E7EB] slide-animate">
            <p class="text-sm sm:text-base text-[#6B7280] leading-relaxed">
              <span class="font-semibold text-[#111827]">Explanation:</span> ${escapeHTML(q.explanation)}
            </p>
          </div>
        `
        : '';

      slideRoot.innerHTML = `
        <div class="slide-animate bg-[#FFFFFF] border border-[#E5E7EB] rounded-2xl p-6 sm:p-10">
          <h2 class="text-xl sm:text-2xl font-semibold text-[#111827] leading-snug mb-8">
            ${escapeHTML(q.question)}
          </h2>

          <div class="space-y-3">
            ${optionsMarkup}
          </div>

          ${explanationMarkup}
        </div>
      `;

      document.querySelectorAll('.choice-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const optIdx = Number(btn.getAttribute('data-opt'));
          selectAnswer(qIdx, optIdx);
        });
      });
    }

    function renderResults() {
      topProgressLabel.textContent = 'Completed';
      topTypeLabel.textContent = '';
      progressLine.style.width = '100%';

      let score = 0;
      state.questions.forEach((q, idx) => {
        const chosen = state.answers[idx];
        if (chosen !== null && q.options[chosen]?.correct) {
          score++;
        }
      });

      const pct = Math.round((score / state.questions.length) * 100);

      slideRoot.innerHTML = `
        <div class="slide-animate bg-[#FFFFFF] border border-[#E5E7EB] rounded-2xl p-8 sm:p-14 text-center">
          <p class="text-xs font-semibold uppercase tracking-widest text-[#6B7280] mb-3">
            Final Score
          </p>
          <div class="text-5xl sm:text-6xl font-bold tracking-tight text-[#111827] mb-2">
            ${score} <span class="text-2xl sm:text-3xl font-normal text-[#6B7280]">/ ${state.questions.length}</span>
          </div>
          <p class="text-base sm:text-lg text-[#6B7280] mb-9">
            ${pct}% Accuracy
          </p>
          <button
            id="restartBtn"
            type="button"
            class="px-6 py-3 rounded-lg text-sm font-medium bg-[#111827] text-white hover:bg-gray-800 transition"
          >
            Restart Quiz
          </button>
        </div>
      `;

      document.getElementById('restartBtn').addEventListener('click', initQuiz);
    }

    function updateFooterControls() {
      const total = state.questions.length;
      prevBtn.disabled = state.slideIndex === 0;
      nextBtn.disabled = state.slideIndex === total + 1;
      nextBtn.textContent = 'Next';
    }

    function render() {
      updateFooterControls();
      if (state.slideIndex === 0) {
        renderIntro();
      } else if (state.slideIndex <= state.questions.length) {
        renderQuestion(state.slideIndex - 1);
      } else {
        renderResults();
      }
    }

    // Button Event Listeners
    prevBtn.addEventListener('click', () => goToSlide(state.slideIndex - 1));
    nextBtn.addEventListener('click', () => goToSlide(state.slideIndex + 1));

    // Keyboard Support (ArrowLeft, ArrowRight, 1-4 / A-D / T-F)
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      if (e.key === 'ArrowRight') {
        e.preventDefault();
        goToSlide(state.slideIndex + 1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        goToSlide(state.slideIndex - 1);
      } else if (state.slideIndex >= 1 && state.slideIndex <= state.questions.length) {
        const qIdx = state.slideIndex - 1;
        const q = state.questions[qIdx];
        const key = e.key.toLowerCase();

        if (q.type === 'Multiple Choice') {
          const map = { '1': 0, a: 0, '2': 1, b: 1, '3': 2, c: 2, '4': 3, d: 3 };
          if (key in map) selectAnswer(qIdx, map[key]);
        } else {
          const map = { '1': 0, t: 0, '2': 1, f: 1 };
          if (key in map) selectAnswer(qIdx, map[key]);
        }
      }
    });

    // Touch Swipe Navigation
    let touchStartX = 0;
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 60) {
        if (diff > 0) goToSlide(state.slideIndex + 1);
        else goToSlide(state.slideIndex - 1);
      }
    }, { passive: true });

    // Start
    initQuiz();
  </script>
</body>
</html>
